name: Build APK
on:
workflow_dispatch:
push:

jobs:
build:
runs-on: ubuntu-latest

steps:
-name: Telecharger le projet
uses: actions/checkout@v4
-name: Installer python
uses:
actions/setup-python@v5
with:
python-version: "3.13"
-name: Installer Buildozer
 run: |
  pip install --upgrade pip
  pip install buildozer cython

-name: Construire l'APK
  run: |
  buildozer android debug

-name: Recuperer l'APK
uses:
actions/upload-artifacts@v4
with:
  name: mon-apk
  path: bin/*.apk
  

  
